<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPlay | Cart</title>
    <link rel="stylesheet" href="../CSS/cart.css">
    <!-- Import fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="nav-container">
            <div class="nav-left">
                <h1 class="logo">PixelPlay</h1>
                <ul class="nav-links">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="contact-us.html">contact-us</a></li>
                </ul>
            </div>
            <div class="nav-right">
                <a href="cart.html" class="cart-icon">🛒<span class="cart-count">2</span></a>
                <div class="account-dropdown">
                    <button class="account-btn">Account ⌄</button>
                    <ul class="dropdown-menu">
                        <li><a href="login.html">Login</a></li>
                        <li><a href="register.html">Sign Up</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>


    <!-- Main Cart Content -->
    <main>
        <div class="cart-container">
            <h2>Your Shopping Cart</h2>
            <div class="cart-items">
                <!-- Cart Item -->
                <div class="cart-item">
                    <img src="../images/tshirt.jpg" alt="PixelPlay T-Shirt">
                    <div class="item-details">
                        <h3>PixelPlay T-Shirt</h3>
                        <p><strong>Price:</strong> $20</p>
                        <p><strong>Quantity:</strong> <input type="number" value="1" min="1"></p>
                        <button class="remove-btn">Remove</button>
                    </div>
                </div>

                <div class="cart-item">
                    <img src="../images/Mouse.jpg" alt="RGB Gaming Mouse">
                    <div class="item-details">
                        <h3>RGB Gaming Mouse</h3>
                        <p><strong>Price:</strong> $45</p>
                        <p><strong>Quantity:</strong> <input type="number" value="1" min="1"></p>
                        <button class="remove-btn">Remove</button>
                    </div>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary">
                <h3>Total: $65</h3>
                <button class="checkout-btn" onclick="location.href='checkout.html'">Proceed to Checkout</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 PixelPlay. All rights reserved.</p>
    </footer>

</body>

</html>
