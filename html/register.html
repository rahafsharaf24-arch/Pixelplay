<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <title>PixelPlay | Sign Up</title>
    <link rel="stylesheet" href="../CSS/sign up.css" />

    <!-- Import fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="nav-container">
            <div class="nav-left">
                <h1 class="logo">PixelPlay</h1>
                <ul class="nav-links">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="contact-us.html">contact-us</a></li>
                </ul>
            </div>
            <div class="nav-right">
                <a href="cart.html" class="cart-icon">🛒<span class="cart-count">2</span></a>
                <div class="account-dropdown">
                    <button class="account-btn">Account ⌄</button>
                    <ul class="dropdown-menu">
                        <li><a href="login.html">Login</a></li>
                        <li><a href="register.html">Sign Up</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>


    <!-- Main -->
    <main>
        <form action="#" method="POST">
            <h2>Create Account</h2>
            <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required />
            <small class="error"></small>
            </div>

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter your email">
            <span class="error" id="emailError"></span>

            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter your password" required />
                <span class="toggle-password">👁️</span>
            </div>

            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter your password" required />
                <span class="toggle-password">👁️</span>
            </div>
            </div>

            <button type="submit">Sign Up</button>

            <p class="login-link">Already have an account? <a href="login.html">Log in</a></p>
        </form>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 PixelPlay. All rights reserved.</p>
    </footer>

</body>
