<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelPlay | Login</title>
  <link rel="stylesheet" href="../CSS/login.css" />
  <link rel="stylesheet" href="../CSS/forms.css">
  <!-- Import fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Poppins:wght@400;600&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <div class="nav-left">
        <h1 class="logo">PixelPlay</h1>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="contact-us.html">contact-us</a></li>
        </ul>
      </div>
      <div class="nav-right">
        <a href="cart.html" class="cart-icon">🛒<span class="cart-count">2</span></a>
        <div class="account-dropdown">
          <button class="account-btn">Account ⌄</button>
          <ul class="dropdown-menu">
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Sign Up</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <!-- Main (Login Box) -->
  <main>
    <form id="loginForm" novalidate>
      <h2>Login</h2>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username">
        <small class="error"></small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
        <small class="error"></small>
      </div>

      <button type="submit">Log In</button>
      <p class="signup-link">Don’t have an account? <a href="register.html">Sign up</a></p>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 PixelPlay. All rights reserved.</p>
  </footer>

  <script src="../JS/form-validation.js"></script>

</body>

</html>
