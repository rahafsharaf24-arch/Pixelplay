<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPlay | Contact Us</title>
    <link rel="stylesheet" href="../CSS/contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Poppins&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
   <header>
        <div class="nav-container">
            <div class="nav-left">
                <h1 class="logo">PixelPlay</h1>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                </ul>
            </div>
            <div class="nav-right">
                <a href="cart.html" class="cart-icon">🛒<span class="cart-count">2</span></a>
                <div class="account-dropdown">
                    <button class="account-btn">Account ⌄</button>
                    <ul class="dropdown-menu">
                        <li><a href="login.html">Login</a></li>
                        <li><a href="register.html">Sign Up</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero / Banner -->
    <section class="hero">
        <h1>Contact Us</h1>
        <p>We’d love to hear your thoughts or any questions about our products!</p>
    </section>

    <!-- Contact Form -->
    <main class="contact-container">
        <form id="contactForm">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="message">Message</label>
            <textarea id="message" placeholder="Write your message here" rows="5" required></textarea>

            <button type="submit">Send</button>
        </form>

        <!-- Google Map -->
        <div class="map-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3875.123456789!2d44.000000!3d15.000000!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0000000000000000%3A0x123456789abcdef!2sPixelPlay!5e0!3m2!1sen!2yem!4v1690000000000!5m2!1sen!2yem" 
                width="100%" 
                height="400" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 PixelPlay. All rights reserved.</p>
    </footer>

    <!-- JS -->
    <script src="../JS/contact.js"></script>

</body>
</html>
